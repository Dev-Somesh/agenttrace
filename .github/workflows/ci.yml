name: CI

# runlanes claims Node 18+ and zero dependencies. Both are claims a matrix
# can actually check, which is more than a bundler workflow would do for a
# project that has no build step.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Tests
        run: npm test

      # The CLI has to start and answer --help without a runner present, since
      # that is exactly the state a first-time user is in.
      - name: CLI responds with no agent runner installed
        if: ${{ !cancelled() }}
        run: |
          node src/cli.js --help > /dev/null
          node src/cli.js --sources || true

      # Zero dependencies is a feature. If one appears, it should be deliberate.
      - name: No runtime dependencies
        if: ${{ !cancelled() }}
        run: |
          DEPS=$(node -p "Object.keys(require('./package.json').dependencies || {}).length")
          echo "runtime dependencies: $DEPS"
          [ "$DEPS" -eq 0 ] || { echo "::error::runlanes is meant to have no runtime dependencies"; exit 1; }

      # Nothing outside src/sources/ may name a vendor. That rule is the whole
      # basis of the adapter layer, and it is easy to break by accident.
      - name: Adapter layer stays vendor-neutral
        if: ${{ !cancelled() }}
        run: |
          if grep -rniE '\.claude|claude-code|anthropic' src --include='*.js' \
               | grep -v '^src/sources/' | grep -v 'src/ui/'; then
            echo "::error::vendor reference found outside src/sources/"
            exit 1
          fi
          echo "No vendor references outside src/sources/."

      # It reads local files and sends nothing. Guard that claim.
      - name: Makes no network calls
        if: ${{ !cancelled() }}
        run: |
          if grep -rnE '\b(fetch|https?\.request|axios|XMLHttpRequest)\s*\(' src --include='*.js'; then
            echo "::error::network call in server-side code — runlanes must stay local-only"
            exit 1
          fi
          echo "No outbound network calls."

      # The network-call grep above no longer covers the whole risk: exposure
      # now happens by spawning ngrok or cloudflared, which no regex for
      # fetch/axios can see. Guard the behaviour instead of the syntax.
      - name: Default bind stays loopback
        if: ${{ !cancelled() }}
        run: |
          if ! grep -q '"127.0.0.1"' src/server.js; then
            echo "::error::server.js no longer names 127.0.0.1 — the default bind must be loopback"
            exit 1
          fi
          if grep -nE 'bindHost\s*=\s*"0\.0\.0\.0"' src/server.js; then
            echo "::error::unconditional wide bind — 0.0.0.0 must depend on an explicit opt-in"
            exit 1
          fi
          node --test test/server.test.js
          echo "Default bind is loopback; wider binds require --lan or --tunnel."
